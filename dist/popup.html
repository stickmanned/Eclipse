<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.5 system-ui, sans-serif; width: 268px; margin: 0; padding: 14px 16px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .host { color: #6b6b7b; font-size: 12px; margin-bottom: 14px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { width: 100%; font: inherit; padding: 9px; border-radius: 8px; cursor: pointer;
               border: 1px solid #6d4aff; background: #6d4aff; color: #fff; }
      button.off { background: transparent; color: inherit; border-color: #cfc9e6; }
      button:disabled { opacity: .5; cursor: default; }
      .stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
      .stat span { color: #6b6b7b; }
      .stats { margin-top: 12px; }
      .msg { margin-top: 12px; font-size: 12px; color: #b3261e; }
      a { color: #6d4aff; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Eclipse</h1>
    <div class="host" id="host"></div>
    <button id="toggle" disabled>…</button>
    <div class="stats" id="stats"></div>
    <div class="msg" id="msg" hidden></div>
    <div style="margin-top:12px"><a href="#" id="opts">Settings</a></div>
    <script src="popup.js"></script>
  </body>
</html>
